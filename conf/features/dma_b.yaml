# @package variables.features
# Paper "Proposed" final feature set for DMA B (paper Table 10). The decomposed
# subset [M_C^d, t_amb^d, t_feels^d, t_max^d] — next-day ambient, feels-like and
# maximum temperature, each in the decomposed form t_x^d = raw + trend + residual
# (paper Table 3 / Section 3.1.3) — plus the holiday handling that was best for
# DMA B in Table 10: the previous-holiday lag (h_lagged) only, without the
# categorical holiday flag. The seasonal component of the weather signals is
# intentionally excluded (the paper folds seasonality in via demand's own
# components). See conf/README.md.
demand:
  raw: true
  decompose: [seasonal, trend, resid]
  lags_days: [6]
weather:
  decompose:
    temp:       [trend, resid]
    feels_like: [trend, resid]
    temp_max:   [trend, resid]
  raw: [temp, feels_like, temp_max]
  future_days: [1]
calendar:
  # h_lagged: on holidays, source the *_past_6 lag features from the previous
  # occurrence of the same holiday instead of a fixed 6-day lag.
  use_previous_holiday: true
